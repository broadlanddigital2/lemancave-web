<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Shared site footer — Le Man Cave</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<footer style="font-family: 'Barlow', system-ui, sans-serif; color: #E4E4E7; border-top: 1px solid #1F1F23; background: #060608">
<div class="lc-section" style="max-width: 1360px; margin: 0 auto; padding: 64px 40px 48px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 16px">
<a href="Main.dc.html" aria-label="Le Man Cave home"><img src="/_blob/d8a1bc65662ee5a26ca2d3cbc9ca559e" alt="Le Man Cave" style="width: 220px; height: auto; display: block; margin-left: -12px"></a>
<p style="margin: 0; color: #A1A1AA; font-size: 15px; line-height: 1.6; max-width: 280px">Norwich’s motorsport entertainment venue — built for petrolheads, brilliant for everyone.</p>
<a href="https://lemancave.co.uk/book" style="align-self: flex-start; background: #ED2835; color: #09090B; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; padding: 14px 20px; border-radius: 4px; text-decoration: none">Book now</a>
</div>
<sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
<nav aria-label="{{c.title}}" style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #71717A; margin-bottom: 4px">{{c.title}}</span>
<sc-for list="{{c.links}}" as="l" hint-placeholder-count="6">
<a href="{{l.href}}" style="color: #D4D4D8; font-size: 15px; text-decoration: none; padding: 2px 0">{{l.label}}</a>
</sc-for>
</nav>
</sc-for>
</div>
<div class="lc-section" style="max-width: 1360px; margin: 0 auto; padding: 32px 40px 40px; border-top: 1px solid #18181B">
<p style="margin: 0 0 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; color: #71717A">PART OF THE FAMILY</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{brands}}" as="b" hint-placeholder-count="4">
<a href="{{b.href}}" aria-label="{{b.name}}" style="display: flex; align-items: center; justify-content: center; height: 104px; padding: 16px; box-sizing: border-box; border: 1px solid #27272A; border-radius: 6px; background: #0B0B0E">
<img src="{{b.logo}}" alt="{{b.name}}" style="max-height: 56px; max-width: 80%; width: auto; height: auto; display: block">
</a>
</sc-for>
</div>
</div>
<div class="lc-section" style="max-width: 1360px; margin: 0 auto; padding: 24px 40px 40px; border-top: 1px solid #18181B; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; color: #71717A">
<span>© 2026 Le Man Cave. All rights reserved.</span>
<span>Norwich, Norfolk · <a href="Sitemap.dc.html" style="color: #71717A">Site map</a> · <a href="Privacy.dc.html" style="color: #71717A">Privacy</a> · <a href="CookiePolicy.dc.html" style="color: #71717A">Cookie policy</a> · <a href="#cookie-settings" style="color: #71717A">Cookie settings</a></span>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const L = (rows) => rows.map(([label, href]) => ({ label, href }));
    return {
      cols: [
        { title: 'EXPLORE', links: L([['Attractions', 'Attractions.dc.html'], ['Food & Drink', 'Food.dc.html'], ['Parties & Events', 'Events.dc.html'], ['Prices', 'Pricing.dc.html'], ['Gallery', 'Gallery.dc.html'], ['Visit Us', 'Visit.dc.html']]) },
        { title: 'POPULAR', links: L([['Pro Racing Simulator', 'Simulator.dc.html'], ['Digital Scalextric', 'Scalextric.dc.html'], ['Birthday Parties', 'Birthday.dc.html'], ['Kids Parties', 'KidsParties.dc.html'], ['Stag & Hen Dos', 'StagDo.dc.html'], ['Team Building', 'TeamBuilding.dc.html'], ['Christmas Parties', 'Christmas.dc.html'], ['Exclusive Venue Hire', 'VenueHire.dc.html']]) },
        { title: 'PLAN YOUR VISIT', links: L([['Opening Times', 'OpeningTimes.dc.html'], ['Travel & Parking', 'TravelParking.dc.html'], ['Accessibility', 'Accessibility.dc.html'], ['FAQs', 'FAQs.dc.html'], ['Gift Vouchers', 'GiftVouchers.dc.html'], ['Advertise With Us', 'Advertise.dc.html'], ['Contact', 'Visit.dc.html']]) },
        { title: 'MORE', links: L([['Who it’s for', 'Events.dc.html'], ['All locations', 'EastAnglia.dc.html'], ['Latest blog posts', 'BlogShell.dc.html'], ['Guides', 'Blog.dc.html'], ['Corporate Events', 'Corporate.dc.html'], ['Comparisons', 'Blog.dc.html']]) }
      ],
      brands: [
        { name: 'Race Car Graphics UK', href: 'https://racecargraphics.uk/', logo: '/_blob/af46cb048a3538fff3ada1542e3a6666' },
        { name: 'Broadland Digital', href: 'https://broadlanddigital.co.uk/', logo: '/_blob/3af5e52699d5da909dbac3e38fd47a32' },
        { name: 'Consensus Media', href: '#', logo: '/_blob/8ca017d8a0e0e8edd2c55f414a56e8af' },
        { name: 'Auto Opulence', href: 'https://autoopulence.co.uk/', logo: '/_blob/30d005beeac001ad9a9af4176bcf0bb6' }
      ]
    };
  }
}
</script>
</body>
</html>
