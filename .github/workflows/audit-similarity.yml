# Temporary (branch audit/similarity only): builds the site and runs the duplicate-content audit, then commits the
# results to this branch. Not on main.
name: Content similarity audit
on:
  push:
    branches: [audit/similarity]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Audit
        run: |
          python3 -I .audit/similarity.py out .audit/groups.json .audit/result.json > .audit/summary.txt
          python3 -I .audit/sections.py out '^/locations/' 40 > .audit/sections-locations.txt
          python3 -I .audit/sections.py out '^/who-its-for/' 20 > .audit/sections-audiences.txt
          python3 -I .audit/sections.py out '^/[a-z-]+$' 40 > .audit/sections-landing.txt
          cat .audit/summary.txt
      - name: Commit results
        run: |
          git config user.name "audit-bot"; git config user.email "actions@users.noreply.github.com"
          git add .audit && git commit -m "Similarity audit results [skip ci]" && git push
