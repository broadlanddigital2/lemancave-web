# Builds the site on every pull request (and push to main) so a broken build is caught before Cloudflare deploys it.
# Also checks the AI-assistant files: robots.txt names the AI crawlers and llms.txt is produced.
name: Validate build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check robots.txt and llms.txt
        run: |
          grep -q "OAI-SearchBot" out/robots.txt
          test -s out/llms.txt
          echo "::notice title=llms.txt::$(grep -c '^- \[' out/llms.txt) pages, $(wc -c < out/llms.txt) bytes"
          node --check worker/index.js
